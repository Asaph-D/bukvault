spring.application.name=order-service
server.port=${ORDER_SERVICE_PORT:8084}

# Dev local : application-local.properties (généré par scripts/sync-g2tpay-local-props.ps1)
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${ORDER_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookvault_order}
spring.datasource.username=${ORDER_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${ORDER_DATASOURCE_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=${ORDER_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.security.oauth2.resourceserver.jwt.secret-key=${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}

order.catalog.base-url=${CATALOG_SERVICE_URL:http://localhost:8083}
order.notification.base-url=${NOTIFICATION_SERVICE_URI:http://localhost:8088}
order.notification.internal-key=${BOOKVAULT_INTERNAL_SERVICE_KEY:bookvault-internal-dev}
order.frontend.base-url=${FRONTEND_URL:http://localhost:4200}
 
# G2TPay — Mobile Money Cameroun (https://g2tpay.net/docs/HTTP_INTEGRATION.md)
order.g2tpay.enabled=${G2TPAY_ENABLED:true}
order.g2tpay.api-key=${G2TPAY_API_KEY:}
order.g2tpay.base-url=${G2TPAY_BASE_URL:https://g2tpay.net}
order.g2tpay.webhook-url=${G2TPAY_WEBHOOK_URL:}
order.g2tpay.gateway-public-url=${GATEWAY_PUBLIC_URL:}
order.g2tpay.eur-to-xaf-rate=${G2TPAY_EUR_TO_XAF_RATE:655.957}
order.g2tpay.operator-mtn=${G2TPAY_OPERATOR_MTN:MTN_CMR}
order.g2tpay.operator-orange=${G2TPAY_OPERATOR_ORANGE:ORANGE_CMR}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
